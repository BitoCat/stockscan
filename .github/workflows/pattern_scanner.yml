name: Pattern Scanner

on:
  workflow_dispatch:
    inputs:
      market:
        description: '市場 (tw 或 us)'
        required: true
        default: 'tw'
        type: choice
        options:
          - tw
          - us
      push_telegram:
        description: '推送 Telegram 彙總'
        required: true
        default: false
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TW_CHANNEL_ID: ${{ secrets.TW_CHANNEL_ID }}
          US_CHANNEL_ID: ${{ secrets.US_CHANNEL_ID }}
        run: |
          if [ "${{ inputs.push_telegram }}" = "true" ]; then
            python pattern_scanner.py --market ${{ inputs.market }} --push
          else
            python pattern_scanner.py --market ${{ inputs.market }}
          fi
