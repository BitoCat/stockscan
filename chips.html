<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全市場籌碼雷達 - 交易大師 ProTrader</title>
<link rel="stylesheet" href="css/base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
  body { padding-bottom: 90px; }
  .cr-wrap { max-width: 1150px; margin: 0 auto; padding: 16px; }
  .cr-title { font-size: 1.5em; font-weight: 700; margin: 12px 0 4px; }
  .cr-sub { color: #888; font-size: 0.9em; margin-bottom: 14px; }
  .cr-back { color: #4da3ff; text-decoration: none; font-size: 0.9em; }

  .cr-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
  .cr-btn {
    padding: 8px 14px; border-radius: 20px; border: 1px solid #444;
    background: #1e1e2a; color: #ddd; cursor: pointer; font-size: 0.95em;
  }
  .cr-btn:hover { border-color: #f0a500; color: #f0a500; }
  .cr-btn.active { background: #f0a500; color: #111; border-color: #f0a500; font-weight: 700; }
  .cr-date { color: #777; font-size: 0.85em; margin: 6px 0 0; }
  .cr-count { color: #999; font-size: 0.88em; margin: 4px 0 0; }

  .cr-table-box { margin-top: 12px; overflow-x: auto; }
  table.cr-table { width: 100%; border-collapse: collapse; font-size: 0.93em; }
  .cr-table th, .cr-table td { padding: 9px 8px; border-bottom: 1px solid #333; text-align: right; white-space: nowrap; }
  .cr-table th { color: #aaa; cursor: pointer; user-select: none; position: sticky; top: 0; background: #15151f; }
  .cr-table th:hover { color: #f0a500; }
  .cr-table td:first-child, .cr-table th:first-child { text-align: left; }
  .cr-stock-link { color: #4da3ff; text-decoration: none; }
  .cr-stock-link:hover { text-decoration: underline; }
  .up { color: #ff4d4d; }
  .down { color: #2ecc71; }
  .muted { color: #666; }
  .tag-otc { color: #b98bff; font-size: 0.82em; }
  .tag-tw { color: #66b3ff; font-size: 0.82em; }
  .chip-absorb { color: #f0a500; font-weight: 700; }
  .chip-distri { color: #ff4d4d; font-weight: 700; }
  .chip-dual   { color: #f0a500; font-weight: 700; }

  .cr-loading { text-align: center; padding: 30px; color: #aaa; }
  .cr-empty { text-align: center; padding: 30px; color: #777; }
  .cr-locked { text-align: center; padding: 60px 20px; }
  .cr-locked h2 { color: #f0a500; }
  .cr-locked a { color: #4da3ff; }
  .cr-note { color: #777; font-size: 0.82em; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="cr-wrap">
  <div class="cr-title">🔑 全市場籌碼雷達</div>
  <div class="cr-sub">
    三大法人足跡 × 股價反應,全市場撈金礦。<a class="cr-back" href="screener.html">← 回股票篩選器</a>
  </div>

  <div id="lockedBox" class="cr-locked" style="display:none">
    <h2>🔒 此功能為付費會員專屬</h2>
    <p>請至 <a href="profile.html">我的帳號</a> 聯繫管理員升級方案</p>
  </div>

  <div id="mainBox" style="display:none">
    <div class="cr-btns" id="filterBtns"></div>
    <div class="cr-date" id="scanDate"></div>
    <div class="cr-count" id="countLine"></div>

    <div class="cr-table-box">
      <div id="loadingBox" class="cr-loading" style="display:none">載入中...</div>
      <div id="emptyBox" class="cr-empty" style="display:none">此條件今日無符合標的</div>
      <table class="cr-table" id="resultTable" style="display:none">
        <thead>
          <tr>
            <th data-key="code">股票</th>
            <th data-key="change_pct">漲跌%</th>
            <th data-key="chip_quadrant">象限</th>
            <th data-key="trust_streak">投信連買▼</th>
            <th data-key="foreign_streak">外資連買</th>
            <th data-key="dual_main">雙主力</th>
            <th data-key="total_net">法人合計(張)</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>

    <div class="cr-note">
      象限=三大法人合計買賣 × 當日漲跌:🟢吸貨=法人買但沒漲(領先訊號)、🔴出貨=法人賣但還漲(警訊)、買漲/賣跌為灰。
      連買=近日同向連續天數(買紅賣綠)。雙主力=當日外資與投信皆淨買。資料每交易日收盤後更新。
      本頁全市場掃描,僅供研究參考,非投資建議。
    </div>
  </div>
</div>

<nav class="tabbar">
  <a class="tb" href="index.html"><span class="ti">🏠</span>首頁</a>
  <a class="tb" href="watchlist.html"><span class="ti">⭐</span>名單</a>
  <a class="tb" href="daily.html"><span class="ti">📊</span>盤面</a>
  <a class="tb" href="tracker.html"><span class="ti">🔭</span>追蹤</a>
  <a class="tb" href="tutorial.html"><span class="ti">📈</span>圖表</a>
  <a class="tb" href="concepts.html"><span class="ti">🧩</span>概念</a>
  <a class="tb active" href="screener.html"><span class="ti">🎯</span>篩選</a>
  <a class="tb" href="profile.html"><span class="ti">👤</span>我的</a>
</nav>

<script>
const SUPABASE_URL = 'https://kldumnxdlgovaxtiszyn.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZHVtbnhkbGdvdmF4dGlzenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjIyNDgsImV4cCI6MjA5MzY5ODI0OH0.P_anfYpSV2tgCPIQ7uZDVBjUFY3UhfEXk9u3XjlzBHI';
const SB_HEADERS = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON };

const FILTERS = [
  { id: 'gold',    name: '💎 精選金礦' },
  { id: 'q2',      name: '🟢 象限2吸貨' },
  { id: 'dual',    name: '🔥 雙主力' },
  { id: 'trust',   name: '📈 投信連買' },
  { id: 'foreign', name: '🌊 外資連買' },
  { id: 'all',     name: '全部' },
];

// 精選金礦收斂條件：象限2 + 法人合計買超≥門檻(張) + 投信連買≥門檻
const GOLD_NET_MIN = 500;    // 法人合計買超張數下限(濾掉只買1張的雜訊)
const GOLD_TRUST_MIN = 2;    // 投信連買天數下限

let allRows = [];
let currentFilter = 'gold';
let sortKey = 'total_net';
let sortAsc = false;

async function checkAccess() {
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const sessRes = await sb.auth.getSession();
    const session = sessRes.data ? sessRes.data.session : null;
    if (!session) { location.href = 'login.html'; return false; }
    const res = await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + session.user.id + '&select=plan', {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + session.access_token }
    });
    const rows = await res.json();
    const plan = (rows && rows[0]) ? rows[0].plan : 'free';
    return ['tw','us','all','admin'].indexOf(plan) !== -1;
  } catch (e) {
    console.error('auth check failed', e);
    return false;
  }
}

function renderFilterBtns() {
  const box = document.getElementById('filterBtns');
  box.innerHTML = FILTERS.map(f =>
    '<button class="cr-btn' + (f.id === currentFilter ? ' active' : '') +
    '" data-id="' + f.id + '">' + f.name + '</button>').join('');
  box.querySelectorAll('.cr-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.id;
      box.querySelectorAll('.cr-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    });
  });
}

async function loadData() {
  const loading = document.getElementById('loadingBox');
  loading.style.display = 'block';
  try {
    // 先抓最新日期
    let r = await fetch(SUPABASE_URL + '/rest/v1/chip_radar?select=date&order=date.desc&limit=1',
                        { headers: SB_HEADERS });
    let d = await r.json();
    if (!Array.isArray(d) || !d.length) {
      loading.style.display = 'none';
      document.getElementById('emptyBox').style.display = 'block';
      return;
    }
    const latest = d[0].date;
    document.getElementById('scanDate').textContent = '資料日期: ' + latest;

    // 抓當日全市場(分頁,量約1000+)
    let rows = [], from = 0;
    while (true) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/chip_radar' +
        '?date=eq.' + latest + '&select=*', {
        headers: Object.assign({}, SB_HEADERS, { 'Range-Unit': 'items', 'Range': from + '-' + (from + 999) })
      });
      const batch = await res.json();
      if (!Array.isArray(batch) || !batch.length) break;
      rows = rows.concat(batch);
      if (batch.length < 1000) break;
      from += 1000;
    }
    allRows = rows;
    loading.style.display = 'none';
    renderTable();
  } catch (e) {
    console.error(e);
    loading.textContent = '載入失敗,請稍後再試';
  }
}

function applyFilter(rows) {
  if (currentFilter === 'gold')    return rows.filter(r =>
        r.chip_quadrant === 2 &&
        (r.total_net || 0) >= GOLD_NET_MIN &&
        (r.trust_streak || 0) >= GOLD_TRUST_MIN);
  if (currentFilter === 'q2')      return rows.filter(r => r.chip_quadrant === 2);
  if (currentFilter === 'dual')    return rows.filter(r => r.dual_main === true);
  if (currentFilter === 'trust')   return rows.filter(r => (r.trust_streak || 0) >= 2);
  if (currentFilter === 'foreign') return rows.filter(r => (r.foreign_streak || 0) >= 3);
  return rows;
}

function streakFmt(v) {
  if (!v) return '<span class="muted">-</span>';
  return v > 0 ? '<span class="up">買' + v + '</span>'
               : '<span class="down">賣' + (-v) + '</span>';
}
function dualFmt(v) {
  return v === true ? '<span class="chip-dual">✓雙</span>' : '<span class="muted">-</span>';
}
function quadFmt(v) {
  if (v === 2) return '<span class="chip-absorb">🟢吸貨</span>';
  if (v === 3) return '<span class="chip-distri">🔴出貨</span>';
  if (v === 1) return '<span class="muted">買漲</span>';
  if (v === 4) return '<span class="muted">賣跌</span>';
  return '<span class="muted">-</span>';
}
function pctClass(v) {
  if (v === null || v === undefined) return '';
  return v > 0 ? 'up' : (v < 0 ? 'down' : '');
}
function netFmt(v) {
  if (v === null || v === undefined) return '<span class="muted">-</span>';
  const cls = v > 0 ? 'up' : (v < 0 ? 'down' : '');
  return '<span class="' + cls + '">' + (v > 0 ? '+' : '') + v.toLocaleString() + '</span>';
}

function renderTable() {
  const table = document.getElementById('resultTable');
  const empty = document.getElementById('emptyBox');
  const rows = applyFilter(allRows);

  document.getElementById('countLine').textContent =
    '符合 ' + rows.length + ' 檔' +
    (currentFilter === 'gold' ? '(象限2 + 法人買超≥' + GOLD_NET_MIN + '張 + 投信連買≥' + GOLD_TRUST_MIN + '日)'
     : currentFilter === 'q2' ? '(法人買、股價還沒動,領先訊號)' : '');

  if (!rows.length) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const sorted = [...rows].sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) return 1;
    if (bv === null || bv === undefined) return -1;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  let html = '';
  sorted.forEach(r => {
    const mtag = r.market === 'otc'
      ? '<span class="tag-otc">櫃</span>' : '<span class="tag-tw">市</span>';
    html += '<tr>' +
      '<td><a class="cr-stock-link" href="diagnosis.html?symbol=' + r.code + '">' +
        r.code + ' ' + (r.name || '') + '</a> ' + mtag + '</td>' +
      '<td class="' + pctClass(r.change_pct) + '">' +
        (r.change_pct !== null && r.change_pct !== undefined ? r.change_pct + '%' : '-') + '</td>' +
      '<td>' + quadFmt(r.chip_quadrant) + '</td>' +
      '<td>' + streakFmt(r.trust_streak) + '</td>' +
      '<td>' + streakFmt(r.foreign_streak) + '</td>' +
      '<td>' + dualFmt(r.dual_main) + '</td>' +
      '<td>' + netFmt(r.total_net) + '</td>' +
      '</tr>';
  });
  document.getElementById('resultBody').innerHTML = html;
  table.style.display = 'table';
}

document.querySelectorAll('.cr-table th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortAsc = !sortAsc; }
    else { sortKey = key; sortAsc = false; }
    document.querySelectorAll('.cr-table th').forEach(h => {
      h.textContent = h.textContent.replace(/[▼▲]/g, '');
    });
    th.textContent = th.textContent + (sortAsc ? '▲' : '▼');
    renderTable();
  });
});

(async function init() {
  const ok = await checkAccess();
  if (!ok) {
    document.getElementById('lockedBox').style.display = 'block';
    return;
  }
  document.getElementById('mainBox').style.display = 'block';
  renderFilterBtns();
  loadData();
})();
</script>
</body>
</html>
