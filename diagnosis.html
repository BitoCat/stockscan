<style>
  .mkt-grp { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; width:fit-content; }
  .mbt { background:transparent; border:none; color:var(--muted); font-family:'Noto Sans TC',sans-serif; font-size:13px; padding:9px 18px; cursor:pointer; transition:all .2s; }
  .mbt.active { background:var(--accent); color:#000; font-weight:700; }
  .mbt:hover:not(.active) { color:var(--accent); }
  .mono-inp { flex:1; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:8px; color:#fff; font-family:'Share Tech Mono',monospace; font-size:16px; letter-spacing:2px; padding:10px 14px; outline:none; transition:all .2s; }
  .mono-inp::placeholder { color:var(--muted); font-size:14px; letter-spacing:1px; font-family:'Noto Sans TC',sans-serif; }
  .mono-inp:focus { border-color:var(--accent); box-shadow:0 0 10px rgba(0,212,255,.15); }
  .res-card { display:none; }
  .res-card.show { display:block; animation:fadeUp .35s ease; }
  .res-header { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; }
  .sid { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:3px; color:#fff; line-height:1; }
  .sname { font-size:18px; color:#fff; margin-top:2px; }
  .metrics-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--border); }
  .met { background:var(--panel2); padding:14px 16px; }
  .met-l { font-size:14px; color:#a8b8d8; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .met-v { font-family:'Share Tech Mono',monospace; font-size:22px; color:#fff; font-weight:700; }
  .met-v.up { color:#00e676; } .met-v.dn { color:#ff5252; } .met-v.yw { color:var(--warn); }
  .met-s { font-size:15px; color:#a8b8d8; margin-top:4px; }
  .analysis-section { padding:16px 18px; }
  .signal-list { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .sig { display:flex; align-items:flex-start; gap:9px; font-size:15px; line-height:1.5; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px; }
  .dot.bull { background:var(--green); box-shadow:0 0 6px var(--green); }
  .dot.bear { background:var(--red); box-shadow:0 0 6px var(--red); }
  .dot.neutral { background:var(--warn); box-shadow:0 0 6px var(--warn); }
  .ai-text { font-size:15px; line-height:1.85; color:var(--text); }
  .ai-section { margin-bottom:20px; padding:14px; background:rgba(255,255,255,.02); border-radius:10px; border-left:3px solid var(--accent); }
  .ai-section-title { color:var(--accent); font-weight:700; font-size:13px; letter-spacing:1px; margin-bottom:8px; display:block; }
  .ai-section-body { line-height:1.9; color:var(--text); font-size:15px; }
  .res-foot { padding:10px 18px; background:rgba(0,0,0,.3); border-top:1px solid var(--border); font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .pts-bar { background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(155,89,182,.06)); border:1px solid rgba(0,212,255,.2); border-radius:10px; padding:10px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .fair-block { grid-column: 1 / -1; margin-top: 8px; background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.25); border-radius: 12px; padding: 18px 20px; text-align: center; }
  .fair-title { font-size: 14px; color: #00d4ff; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .fair-formula { font-size: 15px; color: #ccd6f6; margin-bottom: 14px; line-height: 1.6; }
  .fair-main { font-size: 48px; font-weight: 900; color: #fff; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; line-height: 1; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,212,255,0.5); }
  .fair-note { font-size: 14px; color: #8892b0; line-height: 1.5; margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
  .fair-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .fair-src { font-size: 13px; color: #7a90b0; }
  .fair-section-title { font-size: 14px; color: #a8b8d8; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .fair-analyst-row { display: flex; gap: 8px; }
  .fair-analyst-item { flex: 1; text-align: center; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px 6px; }
  .fair-analyst-item.fair-analyst-mid { background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.2); }
  .fair-analyst-label { font-size: 14px; color: #a8b8d8; margin-bottom: 6px; font-weight: 600; }
  .fair-analyst-val { font-size: 22px; font-weight: 900; font-family: 'Bebas Neue',sans-serif; letter-spacing: 1px; }
  .fair-analyst-val.lo { color: #ff9800; }
  .fair-analyst-val.mid { color: #00d4ff; font-size: 26px; }
  .fair-analyst-val.hi { color: #00e676; }
  .fair-calc-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .fair-calc-item { flex: 1; min-width: 100px; text-align: center; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px 8px; border: 1px solid rgba(255,255,255,0.07); }
  .fair-calc-label { font-size: 14px; color: #a8b8d8; margin-bottom: 6px; font-weight: 600; }
  .fair-calc-val { font-size: 20px; font-weight: 900; color: #fff; font-family: 'Bebas Neue',sans-serif; letter-spacing: 1px; }
  .fair-calc-sub { font-size: 13px; color: #7a90b0; margin-top: 4px; }
  .fair-pe-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .fair-pe-item { flex: 1; min-width: 80px; text-align: center; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 6px; border: 1px solid rgba(255,255,255,0.06); }
  .fair-pe-label { font-size: 14px; color: #a8b8d8; margin-bottom: 6px; font-weight: 600; }
  .fair-pe-val { font-size: 18px; font-weight: 700; color: #fff; font-family: 'Share Tech Mono',monospace; }
  .fair-pe-sub { font-size: 13px; color: #7a90b0; margin-top: 4px; line-height: 1.4; }
</style>

<script>
let currentUser = null, currentProfile = null, currentMkt = 'tw', lastResult = null;

const RAILWAY_URL = 'https://splendid-prosperity-production-41ab.up.railway.app';

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  currentProfile = await getProfile(currentUser.id);
  if (!currentProfile) {
    await sb.from('profiles').insert({ id: currentUser.id, display_name: currentUser.user_metadata?.display_name || currentUser.email.split('@')[0], plan: 'free', daily_count: 0, last_date: new Date().toDateString() }).then(() => {}).catch(() => {});
    currentProfile = await getProfile(currentUser.id);
  }
  const nb = document.getElementById('nav-plan');
  nb.textContent = planLabel(currentProfile?.plan || 'free');
  nb.className = 'plan-badge ' + planBadge(currentProfile?.plan || 'free');
  const pts = await getPoints(currentUser.id);
  document.getElementById('pts-display').textContent = pts + ' 點';
  await getAIKeyFromDB(currentUser.id);
})();

function setMkt(m) {
  currentMkt = m;
  document.getElementById('mbt-tw').classList.toggle('active', m==='tw');
  document.getElementById('mbt-us').classList.toggle('active', m==='us');
}
function quickPick(sym, mkt) { setMkt(mkt); document.getElementById('stock-inp').value = sym; analyze(); }

function toggleLoad(on){
  document.getElementById('loading').style.display = on ? 'block' : 'none';
  document.getElementById('analyze-btn').disabled = on;
}
function showErr(msg){ const e=document.getElementById('err-box'); e.textContent=msg; e.style.display='block'; }
function hideErr(){ document.getElementById('err-box').style.display='none'; }

// ── 統一的報價抓取函式（台股美股共用，不用 AbortSignal.timeout）────
async function fetchQuote(sym) {
  const r = await fetch(RAILWAY_URL + '/quote?symbol=' + sym);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (!data.price) throw new Error('查無報價');
  return data;
}

async function analyze() {
  const sym = document.getElementById('stock-inp').value.trim().toUpperCase();
  if (!/^[A-Z0-9.\-]+$/.test(sym)) {
    showErr('請輸入股票代號（數字或英文），如 2330 或 NVDA，不支援中文名稱');
    return;
  }
  if (!sym) return;
  if (!hasAccess(currentProfile)) { showErr('此功能需要開通會員才能使用，請聯繫管理員開通。'); return; }
  if (!currentProfile?.groq_key || !currentProfile.groq_key.trim()) { showErr('AI 健診需要設定您的 Groq API Key 才能使用。請至「我的帳號」頁面免費申請並填入（申請網址 console.groq.com，約 2 分鐘完成）。'); return; }
  const pts = await getPoints(currentUser.id);
  toggleLoad(true);
  document.getElementById('res-card').classList.remove('show');
  hideErr();

  let livePrice = null, priceContext = '';

  try {
    // ── 台股美股全部走同一條路：Railway /quote ──
    const data = await fetchQuote(sym);

    const closes = (data.closes || []).filter(function(c){ return c != null && !isNaN(c); });
    window.__lastCloses = closes;    
    const highs   = (data.highs  || []).filter(function(v){ return v != null && !isNaN(v); });
    const lows    = (data.lows   || []).filter(function(v){ return v != null && !isNaN(v); });

    if (data.price && closes.length > 0) {
      const ma = function(arr, n) {
        if (arr.length < n) return null;
        const s = arr.slice(-n);
        return (s.reduce(function(a,b){return a+b;}, 0) / s.length).toFixed(2);
      };
      const ma5  = ma(closes, 5);
      const ma20 = ma(closes, 20);
      const ma60 = ma(closes, 60);

      const calcRSI = function(arr, p) {
        p = p || 14;
        if (arr.length < p + 1) return null;
        const s = arr.slice(-(p + 1));
        var g = 0, l = 0;
        for (var i = 1; i < s.length; i++) {
          var d = s[i] - s[i-1];
          if (d > 0) g += d; else l -= d;
        }
        var ag = g/p, al = l/p;
        if (al === 0) return '100.0';
        return (100 - 100/(1 + ag/al)).toFixed(1);
      };
      const rsi = calcRSI(closes);

      const ema = function(arr, n) {
        var k = 2/(n+1), e = arr[0];
        for (var i = 1; i < arr.length; i++) e = arr[i]*k + e*(1-k);
        return e;
      };
      var macd = null;
      if (closes.length >= 26) {
        var e12 = ema(closes.slice(-26), 12), e26 = ema(closes, 26);
        macd = (e12 - e26).toFixed(3);
      }

      // 支撐壓力
      const r5h  = highs.slice(-5),  r5l  = lows.slice(-5);
      const r20h = highs.slice(-20), r20l = lows.slice(-20);
      const r60h = highs.slice(-60), r60l = lows.slice(-60);
      const minArr = function(a){ return a.length ? Math.min.apply(null,a).toFixed(2) : null; };
      const maxArr = function(a){ return a.length ? Math.max.apply(null,a).toFixed(2) : null; };

      const support_s    = minArr(r5l),  resistance_s = maxArr(r5h);
      const support      = minArr(r20l), resistance   = maxArr(r20h);
      const support_l    = minArr(r60l), resistance_l = maxArr(r60h);

      var prevN = Number(data.previousClose);
      if (!isFinite(prevN) || prevN === 0) prevN = Number(closes[closes.length - 2]);
      if (!isFinite(prevN) || prevN === 0) prevN = Number(data.price);
      const prev = prevN;
      const changePct = (isFinite(prevN) && prevN !== 0) ? ((data.price - prevN) / prevN * 100).toFixed(2) : '0.00';

      const today = new Date();
      const dateStr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';

      livePrice = {
        name: data.name || sym,
        price: data.price,
        prev: prev,
        changePct: changePct,
        ma5: ma5, ma20: ma20, ma60: ma60,
        rsi: rsi, macd: macd,
        support_s: support_s, resistance_s: resistance_s,
        support: support, resistance: resistance,
        support_l: support_l, resistance_l: resistance_l,
        date: dateStr,
        forwardEps: data.forwardEps, trailingEps: data.trailingEps,
        forwardPE: data.forwardPE, trailingPE: data.trailingPE,
        pegRatio: data.pegRatio, earningsGrowth: data.earningsGrowth,
        industryPE: data.industryPE,
        targetMeanPrice: data.targetMeanPrice,
        targetLowPrice: data.targetLowPrice,
        targetHighPrice: data.targetHighPrice
      };

      priceContext = '\n\n[即時技術分析資料 ' + dateStr + ']\n' +
        '公司名稱: ' + livePrice.name + '\n' +
        '目前股價: ' + livePrice.price + '\n' +
        '漲跌幅: ' + livePrice.changePct + '%\n' +
        'MA5: ' + (ma5||'N/A') + ' MA20: ' + (ma20||'N/A') + ' MA60: ' + (ma60||'N/A') + '\n' +
        'RSI(14): ' + (rsi||'N/A') + '\n' +
        'MACD: ' + (macd||'N/A') + '\n' +
        '短線支撐: ' + (support_s||'N/A') + ' 短線壓力: ' + (resistance_s||'N/A') + '\n' +
        '中線支撐: ' + (support||'N/A') + ' 中線壓力: ' + (resistance||'N/A') + '\n' +
        '長線支撐: ' + (support_l||'N/A') + ' 長線壓力: ' + (resistance_l||'N/A') + '\n' +
        '[請根據以上真實技術指標進行分析]';
    }
  } catch(e) {
    console.log('報價抓取失敗', e);
  }

  const market = currentMkt === 'tw' ? '台灣股市(台股)' : '美國股市(美股)';

  // 台股補查中文名稱
  var twChineseName = null;
  if (currentMkt === 'tw' && livePrice) {
    try {
      var rr = await sb.from('tw_radar_new_positions').select('stock_name').eq('ticker', sym).limit(1).maybeSingle();
      if (rr.data && rr.data.stock_name) twChineseName = rr.data.stock_name;
      if (!twChineseName) {
        var fr = await sb.from('tw_fund_positions').select('name').eq('ticker', sym).not('name','is',null).limit(1).maybeSingle();
        if (fr.data && fr.data.name) twChineseName = fr.data.name;
      }
    } catch(e) {}
  }

  const displayName = twChineseName || livePrice?.name;
  const companyHint = displayName ? '公司名稱是' + displayName + '，' : '';

  const rsiVal = parseFloat(livePrice?.rsi || 50);
  const rsiNote = rsiVal >= 70 ? '超買警戒' : rsiVal >= 60 ? '偏強' : rsiVal <= 30 ? '超賣反彈機會' : rsiVal <= 40 ? '偏弱' : '中性';
  const maStatus = (livePrice?.ma5 && livePrice?.ma20) ?
    (parseFloat(livePrice.ma5) > parseFloat(livePrice.ma20) ? 'MA5上穿MA20黃金交叉' : 'MA5下穿MA20死亡交叉') : '';
  const macdNote = livePrice?.macd ? (parseFloat(livePrice.macd) > 0 ? 'MACD正值偏多' : 'MACD負值偏空') : '';
  var chipContext = currentMkt === 'tw' ? await fetchChipContext(sym) : '';
  const prompt = '你是頂級股票分析師，擁有20年實戰經驗。' + companyHint + '請對' + market + '股票代號「' + sym + '」進行專業分析。' + priceContext + chipContext +
    '\n\n技術指標解讀：RSI=' + (livePrice?.rsi||'N/A') + '(' + rsiNote + ')，' + maStatus + '，' + macdNote +
    '\n\n請輸出純JSON，格式如下（禁止使用markdown）：' +
    '{' +
    '"stockName":"' + (displayName||sym) + '",' +
    '"sector":"產業別",' +
    '"healthScore":75,' +

    if (!livePrice?.price) {
      showErr('⚠️ 目前無法取得此股票即時資料，分析結果僅供參考，請自行確認股價與公司名稱');

    if (livePrice?.price) { obj.changePct = livePrice.changePct; }
    obj.stockName = displayName || livePrice?.name || obj.stockName;

    if (livePrice) {
      obj.support_s    = livePrice.support_s;    obj.resistance_s = livePrice.resistance_s;
      obj.support      = livePrice.support;       obj.resistance   = livePrice.resistance;
      obj.support_l    = livePrice.support_l;     obj.resistance_l = livePrice.resistance_l;
      obj.forwardEps   = livePrice.forwardEps;    obj.trailingEps  = livePrice.trailingEps;
      obj.forwardPE    = livePrice.forwardPE;     obj.trailingPE   = livePrice.trailingPE;
      obj.pegRatio     = livePrice.pegRatio;      obj.earningsGrowth = livePrice.earningsGrowth;
      obj.industryPE   = livePrice.industryPE;
      obj.targetMeanPrice = livePrice.targetMeanPrice;
      obj.targetLowPrice  = livePrice.targetLowPrice;
      obj.targetHighPrice = livePrice.targetHighPrice;
    }

    lastResult = Object.assign({}, obj, {symbol: sym, market: currentMkt});
    await deductPoint(currentUser.id, 'AI 健診：' + sym);
    const newPts = await getPoints(currentUser.id);
    document.getElementById('pts-display').textContent = newPts + ' 點';
    renderResult(sym, obj);
  } catch(e) { showErr('分析失敗：' + e.message); }
  toggleLoad(false);
}

function gradeClass(g) {
  if (g.includes('強力買進') || g.includes('買進')) return 'g-buy';
  if (g.includes('谷底')) return 'g-rebound';
  if (g.includes('觀察')) return 'g-watch';
  if (g.includes('持有')) return 'g-hold';
  return 'g-avoid';
}

function chipBias(total, foreign, trust, dealer) {
  var score = 0;
  if (trust > 0) score += 2; else if (trust < 0) score -= 2;   // 投信為主角,權重最高
  if (foreign > 0) score += 1; else if (foreign < 0) score -= 1;
  if (total > 0) score += 1; else if (total < 0) score -= 1;
  var notes = [];
  if (foreign > 0 && trust < 0) notes.push('外資買、投信不追(背離,追高留意)');
  else if (foreign < 0 && trust > 0) notes.push('投信逆勢接(底部吸籌型態)');
  if (Math.abs(dealer) > Math.abs(total) && dealer !== 0) notes.push('自營佔比大(多屬避險)');
  var label, color;
  if (score >= 3) { label = '偏多'; color = '#31d071'; }
  else if (score >= 1) { label = '中性偏多'; color = '#8fd0a0'; }
  else if (score <= -3) { label = '偏空'; color = '#ff5470'; }
  else if (score <= -1) { label = '中性偏空'; color = '#e0908c'; }
  else { label = '中性'; color = '#7a90b0'; }
  return { label: label, color: color, notes: notes };
}

function trustStage(trustDaily, closes) {
  var n = trustDaily.length;
  if (n < 20) return { label: '資料不足', color: '#7a90b0', note: '投信歷史不足,約60日後可判讀' };
  var cum = [], s = 0;
  for (var i = 0; i < n; i++) { s += trustDaily[i]; cum.push(s); }
  var cur = cum[n - 1];
  var lo = Math.min.apply(null, cum), hi = Math.max.apply(null, cum);
  var rng = hi > lo ? hi - lo : 1;
  var pos = (cur - lo) / rng * 100;
  var recent5 = 0;
  for (var j = Math.max(0, n - 5); j < n; j++) recent5 += trustDaily[j];
  var pp = null;
  var pc = (closes || []).filter(function (c) { return c != null && !isNaN(c); }).slice(-60);
  if (pc.length >= 20) {
    var plo = Math.min.apply(null, pc), phi = Math.max.apply(null, pc);
    var prng = phi > plo ? phi - plo : 1;
    pp = (pc[pc.length - 1] - plo) / prng * 100;
  }
  var label, color, note;
  if (recent5 > 0 && Math.abs(recent5) >= rng * 0.05) {
    label = '投信加碼中'; color = '#31d071'; note = '近5日持續買進,布局進行式';
  } else if (pos >= 70) {
    label = '投信高持股'; color = '#31d071';
    if (pp != null && pp <= 40) note = '累積在高檔、股價仍低 → 低檔吸滿未發動(黃金訊號)';
    else if (pp != null && pp >= 60) note = '已重壓且股價已漲,留意獲利了結';
    else note = '已重壓,布局大致完成';
  } else if (pos <= 30) {
    label = '投信低持股'; color = '#ff5470'; note = '累積在低檔 → 手上少貨,近期靜止是觀望非布局';
  } else {
    label = '投信中性'; color = '#7a90b0'; note = '持股中等,方向不明';
  }
  return { label: label, color: color, note: note };
}  
  
async function renderChips(sym) {
  var box = document.getElementById('r-chips');
  if (!box) return;
  if (currentMkt !== 'tw') { box.innerHTML = ''; return; }
  var code = (sym || '').replace(/[^0-9]/g, '');

    '<div style="color:var(--muted);font-size:13px;padding:4px 0">載入中...</div>';

  try {
    var res = await sb.from('tw_institutional')
      .select('date,foreign_net,trust_net,dealer_net,total_net')
      .eq('ticker', code)
      .order('date', { ascending: false })
      .limit(60);
    var rows = res.data || [];
    if (!rows.length) {
      box.innerHTML = '<div class="sec-head">🔑 三大法人籌碼</div>' +
        '<div style="color:var(--muted);font-size:13px;padding:4px 0">本檔近期無三大法人資料(可能為上櫃或無交易紀錄)。</div>';
      return;
    }
    rows.reverse();

    // 融資融券近5日
    var mgRows = [];
    try {
      var mgRes = await sb.from('tw_margin')
        .select('date,margin_chg,short_chg')
        .eq('code', code)
        .order('date', { ascending: false })
        .limit(5);
      mgRows = (mgRes.data || []).reverse();
    } catch (e) {}

    var toLot = function (v) { return Math.round((Number(v) || 0) / 1000); };
    var dates = rows.map(function (r) { return String(r.date); });
    var tr = rows.map(function (r) { return toLot(r.trust_net); });
    var fo = rows.map(function (r) { return toLot(r.foreign_net); });
    var de = rows.map(function (r) { return toLot(r.dealer_net); });
    var to = rows.map(function (r) { return toLot(r.total_net); });

    var fmt = function (x) {
      var nn = Math.round(x);
      return (nn > 0 ? '+' : (nn < 0 ? '-' : '')) + Math.abs(nn).toLocaleString('en-US');
    };
    var sumLast = function (arr, k) {
      var s = 0;
      for (var i = Math.max(0, arr.length - k); i < arr.length; i++) s += arr[i];
      return s;
    };

    var bias = chipBias(sumLast(to, 5), sumLast(fo, 5), sumLast(tr, 5), sumLast(de, 5));
    var biasLine = '<div style="color:' + bias.color + ';font-weight:700;font-size:15px;margin:2px 0 8px">近5日籌碼: ' + bias.label +
      (bias.notes.length ? '<span style="font-weight:400;font-size:12px;color:var(--muted)"> · ' + bias.notes.join(' · ') + '</span>' : '') + '</div>';

    var stg = trustStage(tr, (typeof lastResult !== 'undefined' && lastResult && lastResult.closes) ? lastResult.closes : []);
    var stageLine = '<div style="color:' + stg.color + ';font-weight:600;font-size:13px;margin:0 0 8px">投信位階: ' + stg.label + '<span style="font-weight:400;color:var(--muted)"> · ' + stg.note + '</span></div>';
    
    var cell = function (v) {
      var c = v > 0 ? '#31d071' : (v < 0 ? '#ff5470' : '#7a90b0');
      return '<td style="text-align:right;font-family:monospace;color:' + c + ';padding:3px 8px">' + fmt(v) + '</td>';
    };
    var trow = function (label, arr, hl) {
      return '<tr>' +
        '<td style="padding:3px 8px;color:' + (hl ? '#ffb020' : 'var(--muted)') + ';font-weight:' + (hl ? '700' : '400') + '">' + label + '</td>' +
        cell(sumLast(arr, 1)) + cell(sumLast(arr, 3)) + cell(sumLast(arr, 5)) + '</tr>';
    };
    var table = '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px">' +
      '<tr style="color:var(--muted);font-size:11px">' +
      '<th style="text-align:left;padding:3px 8px;font-weight:400">法人 (張)</th>' +
      '<th style="text-align:right;padding:3px 8px;font-weight:400">當日</th>' +
      '<th style="text-align:right;padding:3px 8px;font-weight:400">近3日</th>' +
      '<th style="text-align:right;padding:3px 8px;font-weight:400">近5日</th></tr>' +
      trow('合計', to, false) +
      trow('外資', fo, false) +
      trow('投信', tr, true) +
      trow('自營', de, false) +
      '</table>';

    // 融資融券增減表
    var mgArr = function (k) { return mgRows.map(function (r) { return Number(r[k]) || 0; }); };
    var mgc = mgArr('margin_chg'), shc = mgArr('short_chg');
    var mgTable = '';
    if (mgRows.length) {
      mgTable = '<table style="width:100%;border-collapse:collapse;font-size:13px;margin:0 0 10px">' +
        '<tr style="color:var(--muted);font-size:11px">' +
        '<th style="text-align:left;padding:3px 8px;font-weight:400">信用 增減(張)</th>' +
        '<th style="text-align:right;padding:3px 8px;font-weight:400">當日</th>' +
        '<th style="text-align:right;padding:3px 8px;font-weight:400">近3日</th>' +
        '<th style="text-align:right;padding:3px 8px;font-weight:400">近5日</th></tr>' +
        trow('融資', mgc, false) +
        trow('融券', shc, false) +
        '</table>';
    }

    var K = 5;
    var trK = tr.slice(-K), foK = fo.slice(-K), deK = de.slice(-K);
    var datesK = dates.slice(-K);
    var cum = function (arr) { var s = 0; return arr.map(function (x) { s += x; return s; }); };
    var cTr = cum(trK), cFo = cum(foK), cDe = cum(deK);

    var W = 340, H = 170, padL = 10, padR = 10, padT = 12, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = cTr.length;
    var all = cTr.concat(cFo).concat(cDe); all.push(0);
    var maxV = Math.max.apply(null, all), minV = Math.min.apply(null, all);
    if (maxV === minV) { maxV += 1; minV -= 1; }
    var X = function (i) { return n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1); };
    var Y = function (v) { return padT + (maxV - v) / (maxV - minV) * plotH; };
    var pts = function (arr) { return arr.map(function (v, i) { return X(i).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' '); };
    var zeroY = Y(0).toFixed(1);
    var mmdd = function (d) { return d.slice(4, 6) + '/' + d.slice(6, 8); };
    var lblIdx = n <= 2 ? [0, n - 1] : [0, Math.floor((n - 1) / 2), n - 1];
    var xlabels = lblIdx.map(function (i) {
      var anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
      return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" fill="#4a6080" font-size="9" text-anchor="' + anchor + '" font-family="Share Tech Mono">' + mmdd(datesK[i]) + '</text>';
    }).join('');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W - padR) + '" y2="' + zeroY + '" stroke="#33507d" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<polyline fill="none" stroke="#55708f" stroke-width="1.2" opacity="0.55" points="' + pts(cDe) + '"/>' +
      '<polyline fill="none" stroke="#00d4ff" stroke-width="1.6" points="' + pts(cFo) + '"/>' +
      '<polyline fill="none" stroke="#ffb020" stroke-width="2.4" points="' + pts(cTr) + '" style="filter:drop-shadow(0 0 3px rgba(255,176,32,.5))"/>' +
      xlabels + '</svg>';
    var legend = '<div style="display:flex;gap:14px;justify-content:center;margin-top:4px;font-size:11px;color:var(--muted)">' +
      '<span><span style="color:#ffb020">━</span> 投信</span>' +
      '<span><span style="color:#00d4ff">━</span> 外資</span>' +
      '<span><span style="color:#55708f">━</span> 自營</span></div>';

    box.innerHTML = '<div class="sec-head">🔑 三大法人籌碼</div>' +
      biasLine + stageLine + table + mgTable + svg + legend +
      '<div style="font-size:11px;color:#4a6080;margin-top:6px;line-height:1.5">法人為淨買賣、信用為餘額增減(張,綠增紅減);下圖為近5日法人累積。融資增=散戶加碼、融券增=空方增,判讀仍以三大法人為主。</div>';
  } catch (e) {
    box.innerHTML = '<div class="sec-head">🔑 三大法人籌碼</div>' +
      '<div style="color:var(--muted):font-size:13px;padding:4px 0">籌碼資料載入失敗, 稍後再試。</div>';
  }
}
  
async function renderHolders(sym) {
  var box = document.getElementById('r-holders');
  if (!box) return;
  if (currentMkt !== 'tw') { box.innerHTML = ''; return; }
  var code = (sym || '').replace(/[^0-9]/g, '');
  if (!code || code.length < 4) { box.innerHTML = ''; return; }

  var HEAD = '<div class="sec-head">🏦 大戶 vs 散戶(週)</div>';
  box.innerHTML = HEAD + '<div style="color:var(--muted);font-size:13px;padding:4px 0">載入中...</div>';

  try {
    var res = await sb.from('tw_holder_dispersion')
      .select('date,big400_pct,big1000_pct,small_pct,big400_holders,small_holders')
      .eq('code', code)
      .order('date', { ascending: false })
      .limit(26);
    var rows = res.data || [];
    if (!rows.length) { box.innerHTML = ''; return; }
    rows.reverse();

    var last = rows[rows.length - 1];
    var pct = function (v) { return (v == null ? '—' : (Math.round(Number(v) * 100) / 100) + '%'); };

    var pill = function (label, val, color) {
      return '<div style="flex:1;text-align:center;padding:6px 4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px">' +
        '<div style="font-size:11px;color:var(--muted)">' + label + '</div>' +
        '<div style="font-family:monospace;font-size:15px;color:' + color + '">' + val + '</div></div>';
    };
    var pills = '<div style="display:flex;gap:8px;margin:6px 0 8px">' +
      pill('大戶 >400張', pct(last.big400_pct), '#ffb020') +
      pill('千張大戶', pct(last.big1000_pct), '#ff8c00') +
      pill('散戶 ≤10張', pct(last.small_pct), '#00d4ff') +
      '</div>';

    if (rows.length < 2) {
      box.innerHTML = HEAD + pills +
        '<div style="font-size:12px;color:#4a6080;line-height:1.6">📈 資料每週累積中, 約 6~8 週後這裡會自動長出「大戶 vs 散戶」分岔線。目前為本週快照。</div>';
      return;
    }

    var dates = rows.map(function (r) { return String(r.date); });
    var big = rows.map(function (r) { return Number(r.big400_pct) || 0; });
    var sml = rows.map(function (r) { return Number(r.small_pct) || 0; });

    var bigChg = big[big.length - 1] - big[0];
    var smlChg = sml[sml.length - 1] - sml[0];
    var verdict, vcolor;
    if (bigChg > 0 && smlChg <= 0) { vcolor = '#31d071'; verdict = '大戶增持、散戶退場 → 籌碼向大戶集中(偏多)'; }
    else if (bigChg < 0 && smlChg >= 0) { vcolor = '#ff5470'; verdict = '大戶減持、散戶承接 → 籌碼流向散戶(偏空)'; }
    else { vcolor = 'var(--muted)'; verdict = '大戶與散戶變動方向不一致 → 中性'; }
    var arw = function (c) { return c > 0 ? '▲' : (c < 0 ? '▼' : '—'); };
    var r2 = function (x) { return Math.round(x * 100) / 100; };
    var chgLine = '大戶 ' + arw(bigChg) + ' ' + (bigChg >= 0 ? '+' : '') + r2(bigChg) +
      ' pt · 散戶 ' + arw(smlChg) + ' ' + (smlChg >= 0 ? '+' : '') + r2(smlChg) + ' pt (期間)';

    var W = 340, H = 180, padL = 10, padR = 10, padT = 14, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = rows.length;
    var Xi = function (i) { return n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1); };
    var norm = function (arr) {
      var mx = Math.max.apply(null, arr), mn = Math.min.apply(null, arr);
      if (mx === mn) { mx += 1; mn -= 1; }
      return function (v) { return padT + (mx - v) / (mx - mn) * plotH; };
    };
    var yBig = norm(big), ySml = norm(sml);
    var line = function (arr, yf) {
      return arr.map(function (v, i) { return Xi(i).toFixed(1) + ',' + yf(v).toFixed(1); }).join(' ');
    };

    var mmdd = function (d) { return d.slice(4, 6) + '/' + d.slice(6, 8); };
    var lblIdx = n <= 2 ? [0, n - 1] : [0, Math.floor((n - 1) / 2), n - 1];
    var xlabels = lblIdx.map(function (i) {
      var anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
      return '<text x="' + Xi(i).toFixed(1) + '" y="' + (H - 8) + '" fill="#4a6080" font-size="9" text-anchor="' + anchor + '" font-family="Share Tech Mono">' + mmdd(dates[i]) + '</text>';
    }).join('');

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      '<polyline fill="none" stroke="#00d4ff" stroke-width="2" points="' + line(sml, ySml) + '"/>' +
      '<polyline fill="none" stroke="#ffb020" stroke-width="2.4" points="' + line(big, yBig) + '" style="filter:drop-shadow(0 0 3px rgba(255,176,32,.5))"/>' +
      xlabels + '</svg>';

    var legend = '<div style="display:flex;gap:16px;justify-content:center;margin-top:4px;font-size:11px;color:var(--muted)">' +
      '<span><span style="color:#ffb020">━</span> 大戶(>400張)</span>' +
      '<span><span style="color:#00d4ff">━</span> 散戶(≤10張)</span></div>';

    box.innerHTML = HEAD + pills +
      '<div style="color:' + vcolor + ';font-weight:700;font-size:14px;margin:2px 0 4px">' + verdict + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">' + chgLine + '</div>' +
      svg + legend +
      '<div style="font-size:11px;color:#4a6080;margin-top:6px;line-height:1.5">兩線各自縮放以顯示走勢方向(非同刻度)。大戶上行、散戶下行=籌碼集中, 通常利於股價。資料每週六更新。</div>';
  } catch (e) {
    box.innerHTML = HEAD + '<div style="color:var(--muted):font-size:13px;padding:4px 0">大戶資料載入失敗, 稍後再試。</div>';
  }
}

async function fetchChipContext(sym) {
  var code = (sym || '').replace(/[^0-9]/g, '');
  if (!code || code.length < 4) return '';
  var parts = [];
  try {
    var r1 = await sb.from('tw_institutional')
      .select('date,foreign_net,trust_net,dealer_net')
      .eq('ticker', code).order('date', { ascending: false }).limit(10);
    var rows = r1.data || [];
    if (rows.length) {
      rows.reverse();
      var sum = function (k) { var s = 0; rows.forEach(function (r) { s += (Number(r[k]) || 0); }); return Math.round(s / 1000); };
      var streak = 0;
      for (var i = rows.length - 1; i >= 0; i--) { if ((Number(rows[i].trust_net) || 0) > 0) streak++; else break; }
      var sign = function (n) { return (n > 0 ? '+' : '') + n.toLocaleString('en-US'); };
      parts.push('投信近十日累積淨買超: ' + sign(sum('trust_net')) + ' 張' + (streak >= 2 ? ' (連買 ' + streak + ' 日)' : ''));
      parts.push('外資近十日累積淨買超: ' + sign(sum('foreign_net')) + ' 張');
      parts.push('自營近十日累積: ' + sign(sum('dealer_net')) + ' 張 (多屬避險，參考)');
    }
  } catch (e) {}
  try {
    var r2 = await sb.from('tw_holder_dispersion')
      .select('date,big400_pct,big1000_pct,small_pct')
      .eq('code', code).order('date', { ascending: false }).limit(1);
    var h = (r2.data || [])[0];
    if (h) {
      parts.push('大戶(>400張)持股: ' + h.big400_pct + '%  千張大戶: ' + h.big1000_pct + '%  散戶(<=10張): ' + h.small_pct + '%');
    }
  } catch (e) {}
  if (!parts.length) return '';
  return '\n\n[籌碼面實際數據 (務必納入健診評分與分析)]\n' + parts.join('\n') +
    '\n[判讀提示: 投信為台股主力，投信連續買進代表法人佈局看好；大戶比例高且上升、散戶下降代表籌碼集中，通常利於股價。請把籌碼面納入 healthScore 及【催化劑與風險】的法人籌碼動向。]';
}
